excerpt_139_words: "Leontief systems and intersectoral dependence explain how production requirements propagate through connected economic sectors when final demand changes. This article introduces input-output balance, technical coefficients, final demand, total output, net requirements, the Leontief inverse, direct requirements, indirect requirements, productivity conditions, spectral radius, multipliers, shock propagation, intersectoral dependence, environmental extensions, matrix conditioning, sensitivity analysis, uncertainty, and interpretation governance. It shows how Leontief systems support sector dependency analysis, demand-shock scenarios, supply-chain exposure, clean-energy investment, regional planning, carbon accounting, public health supply systems, and sustainability assessment. The article emphasizes that Leontief modeling requires clear coefficient construction, sector boundaries, productivity checks, invertibility review, condition diagnostics, scenario assumptions, extension coefficients, sensitivity testing, and accountability because fixed-coefficient matrix results are structured estimates, not automatic causal proof."
