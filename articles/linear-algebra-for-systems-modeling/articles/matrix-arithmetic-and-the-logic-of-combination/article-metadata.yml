excerpt_139_words: "Matrix arithmetic and the logic of combination explain how linear algebra combines, compares, scales, and weights structured system representations. This article introduces matrix addition, subtraction, scalar multiplication, linear combinations, weighted combinations, scenario matrices, elementwise operations, compatibility checks, and normalization as practical tools for multivariable systems modeling. It shows why matrix arithmetic matters for combining infrastructure layers, comparing transportation flows, scaling ecological stress matrices, aggregating economic input-output tables, constructing composite indicators, and preparing feature matrices for scientific computing. The article emphasizes that formal compatibility is not enough: matrices must also share row meanings, column meanings, units, orientation, baselines, time periods, and entry definitions. It highlights responsible interpretation by showing how simple arithmetic can hide incompatible measures, undocumented weights, contested priorities, and misleading combinations in applied systems analysis workflows."
