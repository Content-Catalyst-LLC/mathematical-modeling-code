excerpt_139_words: "Linear dynamical systems explain how systems evolve through repeated linear transformation. This article introduces state vectors, update matrices, discrete-time dynamics, matrix powers, trajectories, equilibria, fixed points, eigenvalues, eigenvectors, spectral radius, stability, forced dynamics, affine systems, inputs, outputs, state-space representation, linearization, simulation, numerical diagnostics, and model governance. It shows how a current system state can be mapped into a future state by a matrix, allowing modelers to study growth, decay, oscillation, convergence, instability, and long-run behavior. The article connects linear dynamics to infrastructure condition systems, population-stage models, economic adjustment, network diffusion, control response, public health progression, scientific computing, and iterative algorithms. It emphasizes that linear dynamical models require clear state definitions, time-step discipline, matrix validation, stability review, constraint checks, sensitivity analysis, and responsible interpretation."
