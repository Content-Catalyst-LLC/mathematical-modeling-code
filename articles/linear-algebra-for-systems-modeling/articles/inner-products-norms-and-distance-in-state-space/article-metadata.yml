excerpt_139_words: "Inner products, norms, and distance in state space explain how linear algebra defines geometry for systems modeling. This article introduces dot products, weighted inner products, angles, cosine similarity, vector norms, common norm choices, state-space distance, residual magnitude, scaling, units, normalization, energy-like measures, covariance-aware distance, matrix norms, condition numbers, and distance governance. It shows why vector spaces need additional structure before models can measure alignment, length, similarity, error, or separation. The article emphasizes that distance is never neutral: Euclidean, weighted, standardized, covariance-aware, and domain-specific geometries can produce different judgments about which states are close, anomalous, risky, or meaningfully different. It connects state-space geometry to infrastructure condition states, ecological communities, economic profiles, climate scenarios, machine learning features, policy indicators, numerical diagnostics, reproducible audits, and accountable decision support."
