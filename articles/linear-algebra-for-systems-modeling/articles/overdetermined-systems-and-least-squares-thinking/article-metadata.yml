excerpt_139_words: "Overdetermined systems and least squares thinking explain how linear algebra handles models with more equations, observations, measurements, or constraints than unknowns. This article introduces overdetermined systems, inconsistency, residual vectors, residual norms, least-squares approximation, column-space projection, normal equations, full column rank, identifiability, regression, calibration, weighted least squares, constrained approximation, QR decomposition, singular value decomposition, pseudoinverses, and numerical stability. It shows why exact solutions often disappear in empirical systems, why approximation can still be principled, and why residuals should be interpreted as evidence rather than ignored leftovers. The article emphasizes responsible modeling by distinguishing best fit from truth, small residuals from validity, coefficient estimates from causal meaning, and squared-error minimization from broader judgment under measurement error, scaling choices, outliers, uncertainty, conditioning, solver method, and modeling purpose."
