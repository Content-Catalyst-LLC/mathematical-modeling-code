excerpt_139_words: "Linear transformations and model behavior explain how matrices act on system states. This article introduces linear transformations as structure-preserving maps between vector spaces, showing how matrix action transforms inputs into outputs through scaling, rotation, shearing, projection, mixing, amplification, damping, and collapse. It connects domain, codomain, image, kernel, rank, nullity, transformed basis vectors, superposition, state transitions, sensitivity, norms, determinants, invertibility, and system response to practical modeling interpretation. The article emphasizes that a matrix is not only a coefficient table but a behavioral rule: it reveals which outputs are reachable, which input directions disappear, which differences are amplified, and which structures persist. It also distinguishes useful linear approximation from overextended linear assumptions under units, scaling, nonlinear dynamics, feedback, uncertainty, conditioning, and responsible decision use."
