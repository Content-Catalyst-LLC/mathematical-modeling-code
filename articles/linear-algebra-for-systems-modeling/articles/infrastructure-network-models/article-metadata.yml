excerpt_139_words: "Infrastructure network models explain how built, technical, ecological, and institutional systems depend on connected structure. This article introduces infrastructure networks, asset nodes, physical links, functional dependencies, institutional relationships, multilayer networks, adjacency matrices, incidence matrices, flow vectors, capacity vectors, demand vectors, interdependence, cascading failure, redundancy, resilience, criticality, bottlenecks, vulnerability, spatial structure, temporal structure, operational constraints, scenario analysis, restoration prioritization, sparse computation, data provenance, security, equity, and model governance. It shows how network models support analysis of power grids, water systems, transportation access, hospitals, communication systems, supply-chain infrastructure, emergency response, and climate resilience. The article emphasizes that infrastructure network models require clear asset definitions, edge meanings, capacity semantics, dependency rules, scenario design, recovery priorities, uncertainty review, and accountability because representation choices shape which risks, services, communities, and tradeoffs become visible."
