excerpt_139_words: "Scalars, vectors, and system states explain how linear algebra begins with representation. A scalar describes one quantity, while a vector organizes many related quantities into a structured system state. This article introduces vectors as modeling objects for infrastructure conditions, ecological populations, economic outputs, probability distributions, feature sets, policy indicators, and parameter records. It explains why component order, units, scaling, normalization, documentation, and interpretation matter before any matrix operation, distance calculation, transition model, or simulation can be trusted. The article connects vector notation to state change, norms, similarity, input vectors, feature vectors, probability vectors, and reproducible computational workflows. It emphasizes that vectors are not neutral lists of numbers: they encode choices about what belongs in the system, how quantities are measured, and which comparisons are meaningful. Responsible modeling begins with documented state representation."
