excerpt_139_words: "Numerical stability and conditioning explain why mathematically correct linear algebra can still produce unreliable computational results when systems are sensitive, poorly scaled, nearly singular, or affected by floating-point error. This article introduces floating-point arithmetic, roundoff error, truncation error, residuals, forward error, backward error, condition numbers, matrix norms, singular values, ill-conditioning, near singularity, scaling, normalization, pivoting, stable algorithms, solver choice, least squares, normal equations, eigenvalue sensitivity, SVD diagnostics, sparse solver convergence, perturbation testing, tolerance review, uncertainty, validation, and interpretation governance. It shows how stability diagnostics support infrastructure resilience, economic input-output analysis, machine learning, climate simulation, public health modeling, knowledge retrieval, optimization, and scientific computing. The article emphasizes that computed precision is not the same as reliability because sensitivity, scaling, algorithms, assumptions, and finite precision reshape model evidence."
