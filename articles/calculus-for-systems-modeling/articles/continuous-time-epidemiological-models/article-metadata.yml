excerpt_139_words: "Continuous-Time Epidemiological Models shows how calculus turns infection, recovery, exposure, immunity, contact, intervention, and population movement into a structured systems model. This article introduces continuous-time compartment models for calculus-based systems modeling, including SIR models, SEIR models, susceptible populations, exposed states, infectious prevalence, recovery flows, force of infection, incidence, prevalence, early exponential growth, doubling time, basic and effective reproduction numbers, herd-immunity thresholds, vaccination, waning immunity, time-varying transmission, behavior change, contact structure, calibration, uncertainty, sensitivity, and responsible interpretation. It shows why epidemiological models are useful for mechanism and scenario reasoning but dangerous when simplified outputs are detached from data quality, reporting processes, biology, heterogeneity, equity, and public-health context. Computational workflows support SIR and SEIR scenarios, reproduction-number calculators, SQL governance registries, typed records, Canvas artifacts, and generated reports."
