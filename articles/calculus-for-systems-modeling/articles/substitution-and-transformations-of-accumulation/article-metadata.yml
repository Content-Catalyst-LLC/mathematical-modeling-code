excerpt_139_words: "Substitution and transformations of accumulation explain how accumulated quantities change when a model changes variables, scales, coordinates, clocks, or state representations. This article treats substitution as more than a symbolic integration technique: it is a rule for preserving meaning when accumulation moves from one variable to another. It shows why transformed bounds, scale factors, differentials, orientation, monotonicity, and unit consistency matter for interpreting rates, densities, exposure, cost, distance, process time, normalized states, and transformed coordinates. In systems modeling, substitution helps prevent errors that arise when a convenient variable change silently alters what is being accumulated. The article also explains why nonmonotonic transformations may require piecewise treatment, why signed rates and nonnegative densities behave differently, and how transformed accumulation can be audited through comparison between original and transformed representations."
