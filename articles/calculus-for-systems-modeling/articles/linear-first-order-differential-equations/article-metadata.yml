excerpt_139_words: "Linear first-order differential equations describe dynamic systems where the rate of change depends linearly on the current state, time-varying coefficients, and external inputs. This article explains standard form, homogeneous equations, nonhomogeneous forcing, integrating factors, solution structure, input-loss balance, equilibrium, transients, time-varying coefficients, analytical solutions, numerical approximation, and responsible interpretation. It shows why linear first-order equations matter for systems modeling: they formalize proportional adjustment, decay, recovery, accumulation, forcing, and movement toward equilibrium. In computational workflows, linear-equation audits support analytical-versus-Euler comparison, input-loss diagnostics, equilibrium review, parameter checks, solver-method documentation, SQL assumption registries, calculator scripts, and generated outputs. The article emphasizes documenting state definitions, coefficient meanings, forcing terms, initial conditions, parameter units, equilibrium assumptions, time horizon, numerical method, sensitivity, and the limits of linear approximation."
