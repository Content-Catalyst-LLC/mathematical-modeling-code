excerpt_139_words: "Mechanistic explanation and the limits of formalism help distinguish models that clarify causal structure from models that merely organize symbols. This article introduces mechanistic explanation for calculus-based systems modeling, including causal mechanisms, formal representation, abstraction, idealization, equation structure, parameter interpretation, model validation, explanatory scope, black-box risk, simulation limits, responsible interpretation, reproducible workflows, and model governance. It shows why formalism must be reviewed: a model may fit data, simulate trajectories, or preserve dimensional consistency while still failing to identify a meaningful mechanism. In computational workflows, mechanism audits support mechanism records, formal representation records, evidence links, explanatory claim tables, SQL governance registries, Haskell typed records, calculator scripts, Canvas artifacts, and generated reports. The article emphasizes documenting variables, parameters, units, assumptions, evidence status, validation scope, sensitivity checks, black-box warnings, and claim boundaries."
