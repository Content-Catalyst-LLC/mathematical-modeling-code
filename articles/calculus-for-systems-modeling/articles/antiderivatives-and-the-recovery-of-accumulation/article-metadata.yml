excerpt_139_words: "Antiderivatives recover accumulated quantities from rates of change. This article develops antiderivatives as a systems-modeling tool for reconstructing stocks from flows, exposure from intensity, distance from velocity, burden from rate, cumulative cost from marginal cost, and system state from observed change. It explains primitive functions, constants of integration, initial conditions, flow-to-stock reasoning, marginal-to-total reasoning, unit consistency, numerical accumulation, reconstruction from data, calibration, uncertainty, and responsible interpretation. The article emphasizes that a rate alone does not determine an absolute quantity without a baseline, interval, domain, and accumulation assumption. Companion workflows in Python, R, SQL, and Haskell include antiderivative recovery audits, flow-to-stock reconstruction, trapezoidal accumulation, baseline records, typed accumulation structures, unit checks, assumption registries, and advanced mathematical audit reports for responsible recovery of accumulated system quantities."
