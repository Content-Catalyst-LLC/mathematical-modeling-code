excerpt_139_words: "Sensitivity, robustness, and parameter dependence determine whether a mathematical model is stable under reasonable changes or fragile because of hidden assumptions. This article introduces sensitivity and robustness for calculus-based systems modeling, including local sensitivity, normalized sensitivity, elasticity, finite-difference approximations, parameter sweeps, robustness envelopes, threshold behavior, scenario ranges, interaction effects, uncertainty-aware interpretation, reproducible workflows, and model governance. It shows why sensitivity matters: model conclusions may depend strongly on growth rates, delays, capacities, exposure coefficients, initial values, boundary conditions, solver tolerances, or thresholds. In computational workflows, sensitivity audits support baseline parameter records, tested ranges, finite-difference scores, elasticity estimates, robustness classifications, SQL governance registries, Haskell typed records, calculator scripts, and generated reports. The article emphasizes documenting baselines, units, sources, ranges, perturbation methods, output metrics, solver settings, warnings, and claim boundaries."
