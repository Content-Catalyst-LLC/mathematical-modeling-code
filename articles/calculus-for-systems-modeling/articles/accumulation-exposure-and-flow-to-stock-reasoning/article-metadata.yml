excerpt_139_words: "Accumulation, exposure, and flow-to-stock reasoning explain how local rates become cumulative system consequences. This article treats flows, stocks, exposure, burden, and residence time as linked modeling concepts for interpreting change over time. It shows why stocks contain memory, why current conditions often reflect past inflows and outflows, and why exposure depends on intensity, duration, pathway, population, vulnerability, and measurement window. In systems modeling, this reasoning helps explain emissions burdens, resource depletion, public health exposure, infrastructure wear, financial balances, institutional backlogs, and ecological stress. The article emphasizes that cumulative claims require explicit baselines, initial conditions, sign conventions, units, data resolution, and interval choices. It also distinguishes net stock change from gross activity and accumulated exposure from modeled consequence, helping prevent short-term rates from being mistaken for long-term system burden."
