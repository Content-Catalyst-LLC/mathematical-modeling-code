excerpt_139_words: "Flux, circulation, and spatial flow describe how vector fields cross boundaries, move around paths, and organize movement through continuous space. This article explains vector fields, flux, circulation, normal components, tangent components, oriented surfaces, closed curves, boundary crossing, path alignment, divergence, curl, Green’s theorem, Stokes’ theorem, the divergence theorem, finite sampling, mesh resolution, path resolution, units, sign conventions, and responsible interpretation. It shows why flux and circulation are not interchangeable: flux measures crossing through a surface or boundary, while circulation measures motion around a curve or loop. In computational workflows, spatial-flow audits support flux estimates, circulation diagnostics, orientation checks, path-sampling review, surface-boundary assumptions, SQL governance registries, calculator scripts, and generated outputs. The article emphasizes documenting vector-field meaning, geometry, orientation, units, interpolation, sampling resolution, and interpretive limits."
