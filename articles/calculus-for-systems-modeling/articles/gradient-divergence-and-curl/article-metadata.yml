excerpt_139_words: "Gradient, divergence, and curl are local vector-calculus operators that reveal how fields change, spread, converge, rotate, and organize motion through continuous space. This article explains scalar fields, vector fields, the del operator, gradient, divergence, curl, gradient magnitude, source-sink behavior, rotational tendency, finite-difference approximation, grid spacing, coordinate systems, units, boundary handling, smoothing, flux, circulation, and responsible interpretation. It shows why these operators are not interchangeable: gradient maps scalar fields to directional change, divergence maps vector fields to local spreading or convergence, and curl maps vector fields to local rotation. In computational workflows, field-operator audits support gradient diagnostics, divergence checks, curl summaries, grid-resolution review, SQL assumption registries, calculator scripts, and governance of spatial-field claims. The article emphasizes documenting field meaning, units, coordinates, derivative method, smoothing, boundary rules, and interpretive limits."
