excerpt_139_words: "Differentiability and local behavior explain when a systems model can be understood through first-order approximation. Continuity says nearby inputs produce nearby outputs, but differentiability says the function behaves locally like a linear map. This article develops the derivative as a limit, local linearization, differentiability versus continuity, one-sided derivatives, partial and directional derivatives, gradients, Jacobians, Fréchet differentiability, Gâteaux differentiability, nonsmooth behavior, counterexamples, and boundary cases. It connects these ideas to sensitivity analysis, optimization, calibration, local stability, infrastructure stress, climate response, epidemiological transmission, resource depletion, economic marginal analysis, and policy thresholds. Companion workflows in Python, R, SQL, and Haskell include finite-difference checks, local linearization error, one-sided derivative comparison, kink detection, typed derivative records, assumption registries, invariant checks, and advanced mathematical audit reports for responsible interpretation of derivative-based claims."
