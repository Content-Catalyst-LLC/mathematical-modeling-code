excerpt_139_words: "Case Study: Predator-Prey Systems shows how calculus turns interaction, feedback, oscillation, and stability into a structured systems model. This article introduces predator-prey systems for calculus-based systems modeling, including coupled differential equations, prey growth, predator mortality, encounter rates, conversion efficiency, nullclines, phase planes, equilibria, local stability, oscillation, phase lag, logistic prey limits, functional responses, harvesting, stochasticity, spatial structure, calibration, identifiability, uncertainty, sensitivity, and responsible interpretation. It shows why classic Lotka-Volterra equations are useful as a baseline but insufficient as a complete ecological explanation. In computational workflows, predator-prey audits support parameter records, scenario tables, nullcline notes, Jacobian calculations, SQL governance registries, Haskell typed interaction records, calculator scripts, Canvas artifacts, and generated reports. The article emphasizes documenting variables, interaction assumptions, functional responses, parameter evidence, validation scope, uncertainty, and claim boundaries."
