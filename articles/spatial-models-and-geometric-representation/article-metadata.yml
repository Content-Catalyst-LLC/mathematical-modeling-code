excerpt_139_words: "Spatial models and geometric representation describe systems where location, shape, distance, direction, scale, region, boundary, and spatial arrangement matter. Instead of treating variables as detached from place, spatial models ask how phenomena are distributed across space and how geometry shapes relationships. This article explains how points, lines, polygons, grids, surfaces, fields, coordinate systems, distance metrics, buffers, adjacency, topology, spatial resolution, and geometric transformations become formal model components. It examines spatial abstraction, map projection, spatial interaction, neighborhood structure, interpolation, diffusion, accessibility, clustering, spatial uncertainty, and validation. It also distinguishes geometric representation from geographic realism: a spatial model is not accurate simply because it looks like a map. By treating location and form as mathematical structures, spatial models help analysts reason about movement, exposure, access, infrastructure, ecology, urban systems, public health, climate risk, logistics, and policy decision-support in complex real-world settings."
